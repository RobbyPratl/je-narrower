<title>JE Testing Workspace</title>
<style>
@font-face{font-family:"Instrument Sans";src:url(data:font/woff2;base64,__FONT_SANS__) format("woff2");font-weight:400 600;font-style:normal;font-display:block}
@font-face{font-family:"Martian Mono";src:url(data:font/woff2;base64,__FONT_MONO__) format("woff2");font-weight:400 500;font-style:normal;font-display:block}

/* v5 palette. Colour encodes epistemic status, never hierarchy.
   Committed single light world: v5 rejects dark-with-accent outright, and the
   semantic encoding depends on these exact values. Every colour is painted. */
:root{
  --ground:#F7F8F9;
  --paper:#FFFFFF;
  --ink:#16181D;
  --mute:#8A9099;
  --inferred:#4C5FD5;
  --signal:#C2410C;
  --verified:#0F766E;
  --r1:rgba(22,24,29,.06);
  --r2:rgba(22,24,29,.13);
  --hover:rgba(22,24,29,.035);
  --sans:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --mono:"Martian Mono",ui-monospace,Menlo,monospace;
  --row:30px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
/* mono is for figures only: numbers, account codes, entry ids, timestamps */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.045em}
.lab{font-size:11px;font-weight:500;letter-spacing:.045em;color:rgba(22,24,29,.48)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.harness{display:flex;align-items:center;gap:14px;padding:11px 22px;
  border-bottom:1px solid var(--r2);flex-wrap:wrap}
.harness h1{font-size:12px;font-weight:600;margin:0;letter-spacing:-.005em}
.harness .note{font-size:11px;color:var(--mute);margin-right:auto}
.seg{display:flex;gap:1px;border:1px solid var(--r2);border-radius:4px;padding:2px;background:var(--paper)}
.seg button{padding:3px 10px;border-radius:2px;font-size:11px;font-weight:500;color:rgba(22,24,29,.45)}
.seg button[aria-pressed="true"]{background:rgba(22,24,29,.085);color:var(--ink)}

.scroller{overflow-x:auto}
.app{min-width:1280px;display:flex;flex-direction:column;height:800px;position:relative;background:var(--ground)}

/* ---------- status ---------- */
.status{display:flex;align-items:center;height:46px;padding:0 22px;
  border-bottom:1px solid var(--r2);flex:none;background:var(--paper)}
.status.bad{height:auto;padding:13px 22px;align-items:flex-start;
  background:rgba(194,65,12,.06);border-bottom:2px solid var(--signal)}
.status .lead{font-size:13px;font-weight:600;letter-spacing:-.005em}
.status .sep{color:rgba(138,144,153,.7);margin:0 9px}
.status .meta{font-size:11px;color:rgba(22,24,29,.62)}
.status .meta.key{color:rgba(22,24,29,.9);font-weight:500}
.toggles{margin-left:auto;display:flex;gap:6px}
.toggles button{padding:5px 10px;border:1px solid var(--r2);border-radius:4px;background:var(--paper);
  font-size:11px;font-weight:500;color:rgba(22,24,29,.55)}
.toggles button:hover{border-color:rgba(22,24,29,.24)}
.toggles button[aria-pressed="true"]{background:rgba(22,24,29,.075);border-color:rgba(22,24,29,.26);color:var(--ink)}

.exc{display:flex;flex-direction:column;gap:9px;width:100%}
.exc h2{margin:0;font-size:13px;font-weight:600;color:var(--signal);display:flex;align-items:center;gap:9px}
.exc .sum{font-size:12px;color:rgba(22,24,29,.72);max-width:78ch}
.exc table{border-collapse:collapse;font-size:11px}
.exc td{padding:2px 24px 2px 0}
.exc .neg{color:var(--signal)}
.override{display:flex;gap:8px;align-items:center;margin-top:3px}
.override input{font:inherit;font-size:12px;padding:6px 10px;width:330px;background:var(--paper);
  border:1px solid rgba(22,24,29,.2);border-radius:4px;color:var(--ink)}
.btn{padding:6px 12px;border:1px solid rgba(22,24,29,.24);border-radius:4px;background:var(--paper);
  font-size:11px;font-weight:500}
.btn:hover{border-color:rgba(22,24,29,.4)}
.btn.q{border-color:var(--r2);color:rgba(22,24,29,.68)}

/* ---------- profile ---------- */
.profile{display:none;border-bottom:1px solid var(--r2);flex:none;background:var(--paper)}
.profile[data-open="1"]{display:flex}
.pcard{flex:1;padding:13px 20px 12px;border-right:1px solid var(--r1)}
.pcard:last-child{border-right:0}
.pcard h3{margin:0 0 9px}
.bars{display:flex;align-items:flex-end;gap:3px;height:46px}
.bars i{flex:1;display:block;background:rgba(22,24,29,.6);border-radius:1px 1px 0 0}
.bars i.dim{background:rgba(22,24,29,.2)}
.bars i.sig{background:rgba(194,65,12,.5)}
.pcap{margin-top:8px;font-size:11px}
.pcap b{font-weight:500}.pcap span{color:rgba(22,24,29,.38)}

/* ---------- middle ---------- */
.middle{display:flex;min-height:0;flex:1}
.tablewrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.controls{display:flex;align-items:center;gap:10px;height:40px;padding:0 22px;
  border-bottom:1px solid var(--r2);flex:none}
.progress{width:104px;height:4px;background:rgba(22,24,29,.08);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--verified);opacity:.85}
.spacer{margin-left:auto}

.grid{overflow-y:auto;flex:1;position:relative}
.qgrid{position:absolute;inset:0;pointer-events:none;z-index:0}
.qgrid i{position:absolute;top:0;bottom:0;width:1px;background:rgba(138,144,153,.16)}
.hdr,.main{display:grid;gap:16px;padding:0 22px;align-items:center;position:relative;z-index:1}
.hdr{min-height:46px;padding-top:7px;padding-bottom:6px;border-bottom:1px solid var(--r2);
  position:sticky;top:0;background:rgba(22,24,29,.018);z-index:3;backdrop-filter:none}
/* every cell is wrapped so columns can carry a separator in the gap */
.cel{display:flex;align-items:center;min-width:0;position:relative}
.cel>*{flex:1;min-width:0}
.cel:not(:first-child)::before,.hdr>*:not(:first-child)::before{
  content:"";position:absolute;left:-8px;top:-6px;bottom:-6px;width:1px;background:rgba(22,24,29,.05)}
.hdr>*:not(:first-child)::before{background:rgba(22,24,29,.09);top:-8px;bottom:-7px}
.hdr .h{display:flex;align-items:center;gap:5px;position:relative;cursor:pointer;user-select:none;
  font-size:11px;font-weight:500;letter-spacing:.045em;color:rgba(22,24,29,.48);white-space:nowrap}
.hdr .cadhdr{flex-direction:column;align-items:stretch;gap:5px;cursor:default}
.cadlab{font-size:11px;font-weight:500;letter-spacing:.045em;color:rgba(22,24,29,.48)}
.hdr .h:hover{color:rgba(22,24,29,.8)}
.hdr .h.r{justify-content:flex-end}
.hdr .h .ar{font-size:9px;opacity:.9}
.hdr .grip{position:absolute;right:-9px;top:-8px;bottom:-8px;width:10px;cursor:col-resize;z-index:4}
.hdr .grip:hover{background:rgba(22,24,29,.1)}
.axis{display:grid;grid-template-columns:repeat(12,1fr);font-family:var(--mono);letter-spacing:-.06em}
.axis span{text-align:center;color:var(--mute);font-size:9px}
.axis span.q{color:rgba(22,24,29,.5)}

.row{border-bottom:1px solid var(--r1);position:relative}
.row.dev{background:rgba(194,65,12,.035)}
.main{min-height:var(--row);cursor:pointer}
.row:hover .main{background:var(--hover)}
.row.sel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ink)}
.pair{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:-.045em;
  display:flex;gap:7px;align-items:center;white-space:nowrap}
.pair .gl{color:rgba(22,24,29,.35);width:8px;flex:none}
.row.dev .pair{color:var(--signal)}.row.dev .pair .gl{color:var(--signal)}
.num{font-family:var(--mono);font-size:11px;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;color:rgba(22,24,29,.62)}
.num.r{text-align:right}
.word{font-size:11.5px;color:rgba(22,24,29,.55)}

/* cadence — the dominant mark. no per-row ticks; quarters sit behind the table. */
.cad{position:relative;height:18px}
.cad .mk{position:absolute;border-radius:50%;background:rgba(22,24,29,.8);
  transform:translate(-50%,-50%);top:50%}
.cad .mk.sig{background:var(--signal)}

/* consistency — mid weight */
.cbar{display:flex;align-items:center;gap:8px}
.cbar .t{flex:1;height:4px;background:rgba(22,24,29,.08);border-radius:2px;overflow:hidden}
.cbar .t i{display:block;height:100%;background:rgba(22,24,29,.55)}
.cbar .v{font-family:var(--mono);font-size:10px;color:rgba(22,24,29,.35);letter-spacing:-.045em}
.cbar.none .t{background:repeating-linear-gradient(90deg,rgba(138,144,153,.4) 0 3px,transparent 3px 7px);height:2px}

/* amount — lightest weight */
.amt{display:flex;align-items:center;gap:9px}
.amt .track{position:relative;flex:1;height:8px}
.amt .track:before{content:"";position:absolute;left:0;right:0;top:3.5px;height:1px;background:rgba(138,144,153,.22)}
.amt .bar{position:absolute;top:2px;height:4px;border-radius:2px;background:rgba(22,24,29,.5);min-width:3px}
.amt .v{font-family:var(--mono);font-size:11px;letter-spacing:-.045em;color:rgba(22,24,29,.72);white-space:nowrap}
.row.dev .amt .bar{background:var(--signal)}
.row.dev .amt .v{color:var(--signal)}

.prep{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(22,24,29,.72)}
.prep .sys{width:8px;height:8px;background:rgba(138,144,153,.8);border-radius:1px;flex:none}
.st{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(22,24,29,.42)}
.st.done{color:var(--verified)}
.chips{display:flex;gap:4px;overflow:hidden}
.chip{border:1px solid rgba(22,24,29,.13);border-radius:3px;padding:1px 6px;background:var(--ground);
  font-family:var(--mono);font-size:10px;letter-spacing:-.045em;color:rgba(22,24,29,.6);white-space:nowrap}
.row.dev .chip{border-color:rgba(194,65,12,.35);color:var(--signal);background:rgba(194,65,12,.04)}
.more{font-size:10px;color:rgba(22,24,29,.35);align-self:center}

.kids{display:none}
.row[data-open="1"] .kids{display:block}
.kid{display:grid;grid-template-columns:110px 62px 92px 46px 1fr 86px;gap:16px;
  padding:5px 22px 5px 76px;align-items:center;cursor:pointer;border-top:1px solid var(--r1)}
.kid:hover{background:var(--hover)}
.kid[aria-selected="true"]{background:rgba(22,24,29,.05)}
.kid .id{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:-.045em}

/* ---------- memo, resizable ---------- */
.memo{width:480px;flex:none;border-left:1px solid var(--r2);display:none;
  flex-direction:column;overflow-y:auto;background:var(--paper);position:relative}
.memo[data-open="1"]{display:flex}
.mgrip{position:absolute;left:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:5}
.mgrip:hover{background:rgba(22,24,29,.08)}
.memo header{display:flex;align-items:center;gap:11px;padding:15px 18px 13px 22px;
  border-bottom:1px solid var(--r2);position:sticky;top:0;background:var(--paper);z-index:2}
.memo header .id{font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:-.045em}
.memo header .sub{font-family:var(--mono);font-size:11px;color:rgba(22,24,29,.45);letter-spacing:-.045em}
.sec{padding:15px 22px 17px;border-bottom:1px solid var(--r2)}
.sec h4{margin:0 0 11px;display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:600;letter-spacing:.05em;color:rgba(22,24,29,.55)}
.sec h4 em{font-style:normal;font-weight:400;font-size:11px;color:rgba(22,24,29,.3);letter-spacing:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:11px}
.kv dt{color:rgba(22,24,29,.5);font-family:var(--mono);letter-spacing:-.045em}
.kv dd{margin:0;font-family:var(--mono);font-weight:500;letter-spacing:-.045em;color:rgba(22,24,29,.9)}
.fact{display:flex;gap:7px;align-items:baseline;font-size:11.5px;color:rgba(22,24,29,.86);margin-bottom:6px}
.fact .f{color:var(--mute);font-family:var(--mono);font-size:11px}
.cite{font-size:10px;font-weight:600;color:var(--inferred);border:1px solid rgba(76,95,213,.3);
  border-radius:3px;padding:0 4px;cursor:pointer;background:rgba(76,95,213,.05)}
.cite:hover{background:rgba(76,95,213,.13)}
.sec.interp{border-left:2px solid var(--inferred)}
.sec.interp p{margin:0;font-size:13px;line-height:22px;color:rgba(22,24,29,.8);max-width:60ch}
.sec.interp .warn{margin-top:9px;font-size:11px;color:var(--inferred)}
.ver{display:flex;flex-direction:column;gap:6px;font-size:11.5px}
.ver div{display:flex;gap:8px;align-items:center;color:rgba(22,24,29,.78)}
.ver .un{color:var(--mute)}
textarea{width:100%;min-height:158px;font-family:var(--sans);font-size:13px;line-height:21px;
  padding:13px 14px;border:1px solid rgba(22,24,29,.14);border-radius:4px;
  background:var(--ground);color:rgba(22,24,29,.86);resize:vertical}
.concl{display:flex;flex-direction:column;gap:8px;margin-bottom:15px}
.concl label{display:flex;gap:9px;align-items:center;font-size:12px;cursor:pointer}
.concl input{accent-color:var(--verified);margin:0}
.acts{display:flex;gap:8px}
.acts .rec{border-color:rgba(15,118,110,.45);color:var(--verified);display:flex;align-items:center;gap:7px}

/* ---------- matrix overlay: the visual hook ---------- */
.scrim{position:fixed;inset:0;background:rgba(247,248,249,.82);z-index:50;display:none}
.scrim[data-open="1"]{display:flex;align-items:center;justify-content:center}
.ov{background:var(--paper);border:1px solid rgba(22,24,29,.22);border-radius:5px;
  max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.ov header{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--r2)}
.ov h2{margin:0;font-size:13px;font-weight:600;letter-spacing:-.005em}
.ov .body{display:flex;min-height:0;overflow:auto}
.mx{padding:16px 18px;display:grid;gap:0}
.mx .cl,.mx .rl{font-family:var(--mono);font-size:9px;letter-spacing:-.045em;color:rgba(22,24,29,.5);
  display:flex;align-items:center;justify-content:center}
.mx .rl{justify-content:flex-end;padding-right:8px}
.mx .cell{border:.5px solid rgba(22,24,29,.05);cursor:pointer}
.mx .cell:hover{outline:2px solid var(--ink);outline-offset:-1px;z-index:2}
.mx .cell.NEW{background:var(--signal)}
.mx .cell.SHIFTED{background:rgba(194,65,12,.45)}
.mx .cell.VANISHED{background:repeating-linear-gradient(45deg,rgba(138,144,153,.5) 0 2px,transparent 2px 4px)}
.mx .cell.hi{outline:2px solid var(--ink);outline-offset:-1px}
.side{width:250px;flex:none;border-left:1px solid var(--r2);padding:16px 18px;
  display:flex;flex-direction:column;gap:14px}
.side .rd{display:flex;flex-direction:column;gap:6px}
.side .rd .p{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:-.045em}
.side .rd .nm{font-size:11.5px;color:rgba(22,24,29,.6)}
.key{display:flex;flex-direction:column;gap:7px;font-size:11px;color:rgba(22,24,29,.62)}
.key div{display:flex;align-items:center;gap:9px}
.key i{width:16px;height:11px;flex:none;border:.5px solid rgba(22,24,29,.08)}
.hint{font-size:11px;color:var(--mute)}

/* ---------- empty ---------- */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:40px}
.empty .k{font-size:11px;color:rgba(22,24,29,.38);letter-spacing:.045em}
.empty .h{font-size:15px;font-weight:500;letter-spacing:-.01em}
.empty .s{font-family:var(--mono);font-size:11px;color:rgba(22,24,29,.4);letter-spacing:-.045em}

.pop{position:fixed;z-index:60;background:var(--paper);border:1px solid rgba(22,24,29,.2);
  border-radius:4px;padding:11px 13px;font-family:var(--mono);font-size:11px;letter-spacing:-.045em;
  max-width:340px;display:none}
.pop[data-open="1"]{display:block}
.pop b{display:block;color:rgba(22,24,29,.42);font-weight:400;margin-bottom:6px}
.cols{display:none;position:absolute;right:22px;top:52px;width:290px;z-index:20;background:var(--paper);
  border:1px solid rgba(22,24,29,.2);border-radius:5px;padding:15px}
.cols[data-open="1"]{display:block}
.cols h4{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.05em;color:rgba(22,24,29,.5)}
.cols label{display:flex;gap:9px;align-items:center;font-size:12px;padding:3px 0;cursor:pointer}
.cols input{accent-color:var(--ink);margin:0}
.cols hr{border:0;border-top:1px solid var(--r1);margin:13px 0}
.dens{display:flex;gap:1px;border:1px solid var(--r2);border-radius:4px;padding:2px}
.dens button{flex:1;padding:4px;border-radius:2px;font-size:11px;color:rgba(22,24,29,.5)}
.dens button[aria-pressed="true"]{background:rgba(22,24,29,.085);color:var(--ink)}
</style>

<div class="harness">
  <h1>JE testing workspace</h1>
  <span class="note">v5 prototype &middot; resizable panels, summoned graph</span>
  <div class="seg" role="group" aria-label="Population state">
    <button data-state="ok" aria-pressed="true">Reconciled</button>
    <button data-state="bad" aria-pressed="false">Unreconciled</button>
    <button data-state="none" aria-pressed="false">No population</button>
  </div>
</div>

<div class="scroller">
<div class="app">
  <div id="status"></div>
  <div class="profile" id="profile"></div>
  <div class="cols" id="cols"></div>
  <div class="middle">
    <div class="tablewrap">
      <div class="controls" id="controls"></div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="memo" id="memo" aria-label="Memo drawer"></aside>
  </div>
</div>
</div>
<div class="scrim" id="scrim"></div>
<div class="pop" id="pop"></div>

<script>
"use strict";
const TICK='<svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true" style="flex:none"><path d="M.5 5.4C1.6 6.2 2.8 7.4 3.9 9.2 5.8 5.6 8.2 2.4 11 .5" fill="none" stroke="CLR" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const tick=(c)=>TICK.replace('CLR',c||'#0F766E');
const CROSS='<svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true" style="flex:none"><path d="M.6.6C3.1 3.4 6.6 6.6 9.6 9.6M9.6.6C7.1 3.4 3.6 6.6.6 9.6" fill="none" stroke="#C2410C" stroke-width="1.75" stroke-linecap="round"/></svg>';

// One shared amount scale for every row. v5 forbids per-row auto-scaling; a square
// root keeps ordering honest while giving 2-13k rows resolution a linear scale
// against an 88.4k outlier destroys.
const AMAX=92000, ax=(v)=>Math.sqrt(Math.min(v,AMAX)/AMAX)*100;
const k=(v)=>v>=1000?(v/1000).toFixed(1).replace(/\.0$/,'')+'k':String(v);
const norm=(p)=>p.split('/').map(s=>s.trim()).sort().join('|');
const evenly=(a)=>Array.from({length:12},(_,i)=>({m:i,f:.5,amt:a}));
const at=(m,f,amt,dev)=>({m,f,amt,dev});

const ROWS=[
 {kind:'group',pair:'6210 / 2110',n:45,marks:evenly(8600),c:.95,amt:[8200,9100,8600],prep:{t:'one',l:'R'},st:'open',rules:['round_amount','off_hours'],rec:'monthly'},
 {kind:'group',pair:'5100 / 1590',n:12,marks:evenly(4000),c:.93,amt:[4000,4000,4000],prep:{t:'sys'},st:'open',rules:['off_hours'],rec:'monthly'},
 {kind:'group',pair:'1100 / 4200',n:28,marks:evenly(12700),c:.88,amt:[12400,13100,12700],prep:{t:'one',l:'A'},st:'open',rules:['round_amount'],rec:'monthly'},
 {kind:'deviation',pair:'6210 / 2110',n:1,marks:[at(7,.52,88400,1)],c:null,amt:[88400,88400,88400],prep:{t:'one',l:'M'},st:'open',rules:['deviation','amt 5x median','new preparer'],rec:'once'},
 {kind:'group',pair:'4010 / 2300',n:3,open:1,marks:[at(8,.45,25000),at(8,.93,25000),at(9,.38,40000)],c:.33,amt:[25000,40000,25000],prep:{t:'two',l:'R,M'},st:'open',rules:['pair_rarity','new_pair','round_amount'],rec:'emergent',
  kids:[{id:'ACC-JV-0417',d:'14 Sep',a:'25,000.00',s:.62,rules:['pr','np','ra'],st:'open'},
        {id:'ACC-JV-0463',d:'28 Sep',a:'25,000.00',s:.62,rules:['pr','np','ra'],st:'open'},
        {id:'ACC-JV-0501',d:'12 Oct',a:'40,000.00',s:.71,rules:['pr','np'],st:'reviewed'}]},

const ACCTS=[['1000','Cash'],['1100','Bank'],['1200','Prepaid expenses'],['1400','Stock in hand'],
 ['1590','Accum depreciation'],['1600','Equipment'],['2110','Accrued liabilities'],['2210','Creditors'],
 ['2300','Deferred revenue'],['2400','Payroll withholding'],['2500','Tax payable'],['3000','Retained earnings'],
 ['4010','Sales revenue'],['4200','Installation services'],['4300','Other income'],['5100','COGS'],
 ['5200','Freight'],['6210','Consulting'],['6300','Depreciation'],['6800','Utilities'],
 ['7100','Travel'],['7300','Insurance']];
const FORCED={'2300|4010':['NEW',0,3],'2210|6800':['NEW',0,4],'2110|7100':['NEW',0,2],
 '1400|4200':['NEW',0,6],'2500|4300':['NEW',0,3],'2110|2210':['SHIFTED',31,64],
 '1400|2400':['VANISHED',18,0],'1200|7300':['VANISHED',9,0],
 '2110|6210':['STABLE',22,23],'1590|5100':['STABLE',6,6],'1100|4200':['STABLE',14,14],
 '1000|5200':['STABLE',9,9],'1100|4010':['STABLE',5,4],'1000|2400':['STABLE',12,12],
 '1400|5100':['STABLE',8,8]};
let PAIRS=null;
function buildPairs(){
  if(PAIRS)return PAIRS;
  PAIRS={};let s=20250914;
  const rnd=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};
  for(let i=0;i<ACCTS.length;i++)for(let j=0;j<i;j++){
    const key=[ACCTS[j][0],ACCTS[i][0]].sort().join('|');
    if(FORCED[key]){const[st,p1,p2]=FORCED[key];PAIRS[key]={st,p1,p2};continue;}
    const r=rnd();
    if(r<.46)continue;                                  // most account pairs never occur
    if(r<.50){PAIRS[key]={st:'NEW',p1:0,p2:1+Math.floor(rnd()*4)};}
    else if(r<.535){const c=2+Math.floor(rnd()*14);PAIRS[key]={st:'VANISHED',p1:c,p2:0};}
    else if(r<.59){const a=4+Math.floor(rnd()*20);PAIRS[key]={st:'SHIFTED',p1:a,p2:Math.round(a*(1.8+rnd()))};}
    else {const c=1+Math.floor(rnd()*24);PAIRS[key]={st:'STABLE',p1:c,p2:c+Math.round((rnd()-.5)*2)};}
  }
  return PAIRS;
}

      b.onclick=open;b.onkeydown=(e)=>{if(e.key==='Enter')open(e);};});
  }
  m.querySelector('#mx').onclick=()=>{state.sel=null;render();};
  m.querySelector('#mgrip').onmousedown=(e)=>{
    e.preventDefault();
    const x0=e.clientX,w0=state.memoW;
    const mv=(ev)=>{state.memoW=Math.min(760,Math.max(380,w0-(ev.clientX-x0)));m.style.width=state.memoW+'px';};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);};
}
document.addEventListener('click',()=>{el('pop').dataset.open=0;});

/* ---------------- matrix overlay ---------------- */
function openMatrix(){state.mx=1;renderMatrix();}
function renderMatrix(){
  const sc=el('scrim');sc.dataset.open=state.mx?1:0;
  if(!state.mx){sc.innerHTML='';return;}
  const P=buildPairs(),N=ACCTS.length,CELL=26;
  const counts={NEW:0,VANISHED:0,SHIFTED:0,STABLE:0};
  Object.values(P).forEach(v=>counts[v.st]++);
  const maxc=Math.max(...Object.values(P).map(v=>Math.max(v.p1,v.p2)));
  const cells=[];
  cells.push(`<span></span>`);
  for(let j=0;j<N-1;j++)cells.push(`<span class="cl">${ACCTS[j][0]}</span>`);
  for(let i=1;i<N;i++){
    cells.push(`<span class="rl">${ACCTS[i][0]}</span>`);
    for(let j=0;j<N-1;j++){
      if(j>=i){cells.push(`<span></span>`);continue;}
      const key=[ACCTS[j][0],ACCTS[i][0]].sort().join('|'),d=P[key];
      if(!d){cells.push(`<span class="cell" data-k=""></span>`);continue;}
      let cls=d.st,style='';
      if(state.gmode!=='diff'){
        const c=state.gmode==='p1'?d.p1:d.p2;
        cls='';style=c?`background:rgba(22,24,29,${(.12+.62*c/maxc).toFixed(3)})`:'';
        if(c&&c<=2)style='background:rgba(194,65,12,.75)';           // rare within period
      } else if(d.st==='STABLE'){
        cls='';style=`background:rgba(22,24,29,${(.06+.26*Math.min(d.p2,maxc)/maxc).toFixed(3)})`;
      }
      cells.push(`<span class="cell ${cls}" style="${style}" data-k="${key}" tabindex="0" role="button"></span>`);
    }
  }
  const legend=state.gmode==='diff'
    ? [['NEW','background:#C2410C',counts.NEW],['SHIFTED','background:rgba(194,65,12,.45)',counts.SHIFTED],
       ['VANISHED','background:repeating-linear-gradient(45deg,rgba(138,144,153,.5) 0 2px,transparent 2px 4px)',counts.VANISHED],
       ['STABLE','background:rgba(22,24,29,.2)',counts.STABLE]]
    : [['common','background:rgba(22,24,29,.6)',''],['rare','background:rgba(194,65,12,.75)',''],['absent','background:transparent',' ']];
  sc.innerHTML=`<div class="ov" role="dialog" aria-label="Account pair diff">
    <header><h2>Account pairs</h2>
      <span class="seg">${['diff','p1','p2'].map(o=>`<button data-g="${o}" aria-pressed="${state.gmode===o}">${o}</button>`).join('')}</span>
      <span class="hint">lower triangle · pairs are unordered</span>
      <span style="margin-left:auto"></span>
      <button class="btn q" id="ovx">Close</button></header>
    <div class="body">
      <div class="mx" style="grid-template-columns:44px repeat(${N-1},${CELL}px);grid-auto-rows:${CELL}px">${cells.join('')}</div>
      <div class="side">
        <div><div class="lab" style="margin-bottom:9px">READOUT</div>
          <div class="rd" id="rd"><span class="hint">Hover a cell.</span></div></div>
        <div><div class="lab" style="margin-bottom:9px">${state.gmode==='diff'?'STATUS':'FREQUENCY'}</div>
          <div class="key">${legend.map(([n,st,ct])=>`<div><i style="${st}"></i>${n}${ct!==''?` <span class="mono" style="margin-left:auto;color:rgba(22,24,29,.45)">${ct}</span>`:''}</div>`).join('')}</div></div>
        <div class="hint" style="margin-top:auto">${ACCTS.length} of 34 accounts by volume. Click a cell to filter the table to that pair.</div>
      </div></div></div>`;
  sc.querySelector('#ovx').onclick=()=>{state.mx=0;renderMatrix();};
  sc.onclick=(e)=>{if(e.target===sc){state.mx=0;renderMatrix();}};
  sc.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{state.gmode=b.dataset.g;renderMatrix();});
  const nameOf=(c)=>(ACCTS.find(a=>a[0]===c)||[c,''])[1];
  sc.querySelectorAll('.cell').forEach(c=>{
    const key=c.dataset.k;
    c.onmouseenter=()=>{
      const rd=sc.querySelector('#rd');
      if(!key){rd.innerHTML=`<span class="hint">No pairing between these accounts.</span>`;return;}
      const d=P[key],[a,b]=key.split('|');
      rd.innerHTML=`<span class="p">${a} ↔ ${b}</span>
        <span class="nm">${nameOf(a)} ↔ ${nameOf(b)}</span>
        <div class="kv" style="margin-top:8px">
          <dt>status</dt><dd${d.st==='NEW'?' style="color:var(--signal)"':''}>${d.st}</dd>
          <dt>p1Count</dt><dd>${d.p1}</dd><dt>p2Count</dt><dd>${d.p2}</dd>
          <dt>delta</dt><dd>${d.p2-d.p1>0?'+':''}${d.p2-d.p1}</dd></div>`;};
    if(key)c.onclick=()=>{state.edge=key;state.mx=0;state.filter='all';render();};
  });
}

/* ---------------- columns panel ---------------- */
function renderCols(){
  const c=el('cols');c.dataset.open=state.cols?1:0;
  if(!state.cols){c.innerHTML='';return;}
  c.innerHTML=`<h4>COLUMNS</h4>${ORDER.map(id=>
    `<label><input type="checkbox" data-col="${id}" ${show(id)?'checked':''}> ${COLS[id].lab}</label>`).join('')}
    <hr><h4>DENSITY</h4><div class="dens">${[['compact',30],['standard',36],['comfortable',44]]
      .map(([l,v])=>`<button data-d="${v}" aria-pressed="${state.density===v}">${l}</button>`).join('')}</div>
    <hr><h4>SAVED VIEWS</h4><div class="dens">
      <button data-v="triage">Triage</button><button data-v="detail">Detail</button></div>`;
  c.querySelectorAll('[data-col]').forEach(b=>b.onchange=()=>{
    const id=b.dataset.col;state.hidden.has(id)?state.hidden.delete(id):state.hidden.add(id);render();});
  c.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.density=+b.dataset.d;render();});
  c.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    state.hidden=b.dataset.v==='triage'
      ? new Set(['recurrence','composite','period','gap','lines','case'])
      : new Set(['gap','period']);
    render();});
}

/* ---------------- render ---------------- */
function render(){
  document.documentElement.style.setProperty('--row',state.density+'px');
  renderStatus();
  if(state.pop==='none'){
    ['profile','cols'].forEach(i=>el(i).dataset.open=0);
    el('controls').innerHTML='';
    el('grid').innerHTML=`<div class="empty"><span class="k lab">NO POPULATION</span>
      <span class="h">Create a business and ingest a population to begin.</span>
      <span class="s">expects  GL export per period  ·  trial balance</span>
      <button class="btn" style="margin-top:8px">Ingest population</button></div>`;
    el('memo').dataset.open=0;el('memo').innerHTML='';return;
  }
  renderProfile();renderControls();renderGrid();renderMemo();renderCols();
  const blocked=state.pop==='bad',mid=document.querySelector('.middle');
  mid.style.opacity=blocked?.4:1;mid.style.pointerEvents=blocked?'none':'auto';
}
document.querySelectorAll('.harness [data-state]').forEach(b=>b.onclick=()=>{
  state.pop=b.dataset.state;state.sel=null;state.override=null;state.edge=null;
  document.querySelectorAll('.harness [data-state]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();});
document.addEventListener('keydown',(e)=>{
  if(e.target.matches('input,textarea'))return;
  if(e.key==='g'){state.mx=state.mx?0:1;renderMatrix();}
  if(e.key==='Escape'){if(state.mx){state.mx=0;renderMatrix();}else if(state.sel){state.sel=null;render();}}
  if(e.key==='m'&&state.sel){state.sel=null;render();}});
render();
</script>
